server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # BirdNET-Go on the host (port 8085). HTTPS pages cannot talk to :8085
    # directly (mixed content), and browsers cannot play the RTSP source.
    location /api/birdnet/ {
        rewrite ^/api/birdnet/(.*)$ /api/v2/$1 break;
        proxy_pass http://host.docker.internal:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # LiveATC via icy-stripping proxy (browser <audio> cannot play Icecast metadata).
    # Use rewrite + fixed upstream (not $1 in proxy_pass) so nginx resolves
    # liveatc-proxy at startup without needing an explicit resolver.
    location /api/liveatc/ {
        rewrite ^/api/liveatc/(.*)$ /$1 break;
        proxy_pass http://liveatc-proxy:8091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store";
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # atm.abkmj.com does not send CORS headers; proxy it same-origin.
    location = /api/aircraft {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $atm_upstream https://atm.abkmj.com/api/data;
        proxy_pass $atm_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host atm.abkmj.com;
        proxy_set_header Accept application/json;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
