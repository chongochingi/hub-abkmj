<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub · abkmj</title>
    <meta
      name="description"
      content="Live aircraft, NEXRAD, NWS warnings, GOES, Mesonet, and wildfires on one map."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel" class="panel" aria-label="Data">
      <header class="panel-head">
        <div>
          <div class="brand">Data</div>
          <p class="panel-sub">Weather · aircraft · fire</p>
        </div>
        <div class="panel-head-actions">
          <button id="layers-clear" class="panel-action" type="button">Clear all</button>
          <button id="panel-min" class="icon-btn panel-min" aria-label="Minimize data">
            –
          </button>
        </div>
      </header>

      <div id="layer-list" class="layer-list"></div>

      <footer class="panel-foot">
        <div class="panel-foot-row">
          <div id="status" class="status">Connecting…</div>
          <div class="links">
            <a href="https://atm.abkmj.com" target="_blank" rel="noreferrer">ATM</a>
            <a href="https://adsb.abkmj.com" target="_blank" rel="noreferrer">Feed</a>
            <a href="https://abkmj.com" target="_blank" rel="noreferrer">Blog</a>
          </div>
        </div>
        <div id="theme-toggle" class="theme-toggle" aria-label="Map theme"></div>
      </footer>
    </aside>

    <button id="panel-open" class="fab" aria-label="Open data" hidden>
      Data
    </button>

    <aside id="birdnet-panel" class="panel panel-right" aria-label="Audio">
      <header class="panel-head">
        <div>
          <div class="brand">Audio</div>
          <p id="birdnet-sub" class="panel-sub">Yard · ATC</p>
        </div>
        <div class="panel-head-actions">
          <button id="audio-off" class="panel-action" type="button">Turn off all</button>
          <button id="birdnet-min" class="icon-btn bn-min" aria-label="Minimize audio">
            –
          </button>
        </div>
      </header>
      <div id="birdnet-body" class="bn-body"></div>
      <footer class="panel-foot">
        <div id="birdnet-status" class="status">Connecting…</div>
      </footer>
    </aside>

    <button id="birdnet-open" class="fab fab-right" aria-label="Open audio" hidden>
      Audio
    </button>

    <button id="recenter" class="map-btn" aria-label="Recenter on Oklahoma City">
      ⌖
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
