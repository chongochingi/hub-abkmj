<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODOT Camera</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        color: #eaedf3;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
      }
      .sub {
        margin: 2px 0 0;
        font-size: 0.75rem;
        color: #94a3b8;
      }
      .stage {
        position: relative;
        height: calc(100% - 52px);
        background: #000;
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: #000;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #94a3b8;
        font-size: 0.88rem;
        padding: 16px;
        text-align: center;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay.err {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 id="title">ODOT Camera</h1>
        <p id="sub" class="sub"></p>
      </div>
    </header>
    <div class="stage">
      <video id="video" autoplay muted playsinline controls></video>
      <div id="loading" class="overlay">Loading stream…</div>
      <div id="err" class="overlay err" hidden></div>
    </div>
    <script type="module" src="/src/odot-camera.js"></script>
  </body>
</html>
